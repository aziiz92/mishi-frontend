    <script>
      if (location.pathname === '/') {
        let locale = navigator.language.toLowerCase().startsWith('fr') ? 'fr' : 'en';
        try {
          const saved = localStorage.getItem('mishi_lang');
          if (saved === 'fr' || saved === 'en') locale = saved;
        } catch {}
        location.replace(`/${locale}/${location.search}${location.hash}`);
      }
    </script>
